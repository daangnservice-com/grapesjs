<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EBEFF3"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF6F0F"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative pattern circles -->
  <circle cx="500" cy="80" r="140" fill="#E2E7ED" opacity="0.35"/>
  <circle cx="100" cy="340" r="100" fill="#E2E7ED" opacity="0.3"/>
  
  <!-- Center Illustration Container -->
  <g transform="translate(300, 180)">
    <!-- Document Card Mockup -->
    <rect x="-90" y="-80" width="180" height="130" rx="16" fill="#FFFFFF" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.06))"/>
    
    <!-- Skeleton content lines inside document -->
    <rect x="-65" y="-55" width="60" height="10" rx="5" fill="#FFE5D3"/>
    <rect x="-65" y="-30" width="130" height="12" rx="6" fill="#212124" opacity="0.15"/>
    <rect x="-65" y="-8" width="110" height="8" rx="4" fill="#9CA1AB" opacity="0.25"/>
    <rect x="-65" y="8" width="90" height="8" rx="4" fill="#9CA1AB" opacity="0.2"/>
    
    <!-- Sparkle / Pen / Plus Badge -->
    <circle cx="70" cy="40" r="28" fill="url(#carrotGrad)" filter="drop-shadow(0 6px 14px rgba(255,111,15,0.35))"/>
    <!-- Pencil / Edit Icon -->
    <path d="M62 48 L76 34 L78 36 L64 50 Z" fill="#FFFFFF"/>
    <path d="M60 50 L64 50 L62 46 Z" fill="#FFFFFF"/>
    <path d="M78 32 L80 34 L78 36 L76 34 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="300" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="17" font-weight="700" fill="#4D5159" letter-spacing="-0.3">더 좋은 콘텐츠를 준비 중이에요</text>
  <text x="300" y="324" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#9CA1AB">새로운 당근서비스 이야기를 기대해 주세요</text>
</svg>
