<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당근서비스 채용 관리자 로그인</title>
  <link rel="icon" type="image/png" href="/images/daangn-service-logo.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --seed-orange: #FF6F0F;
      --seed-orange-hover: #E55E00;
      --seed-text-dark: #111111;
      --seed-bg-light: #F7F9FA;
      --seed-border: #E9ECEF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'KarrotSans', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--seed-bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--seed-text-dark);
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--seed-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      display: inline-block;
      background: rgba(255, 111, 15, 0.1);
      color: var(--seed-orange);
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .logo-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      color: var(--seed-text-dark);
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--seed-orange);
      box-shadow: 0 0 0 3px rgba(255, 111, 15, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: var(--seed-orange);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background-color: var(--seed-orange-hover);
    }
    .error-msg {
      background-color: #FEE2E2;
      color: #DC2626;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .footer-note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-container">
      <div style="display: flex; justify-content: center; margin-bottom: 16px;">
        <img src="/images/daangn-service-logo.png" alt="당근서비스" style="height: 42px; width: auto; display: block;" />
      </div>
      <h1 class="logo-title">채용 빌더 관리자</h1>
      <p class="subtitle">HR팀 전용 페이지 편집 관리자입니다.</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required placeholder="아이디 입력" />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required placeholder="비밀번호 입력" />
      </div>
      <button type="submit" class="btn-login">로그인하기</button>
    </form>

    <div class="footer-note">
      careers.daangnservice.com/admin
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errorMsg.textContent = data.error || '로그인 정보가 올바르지 않습니다.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = '서버 통신 오류가 발생했습니다.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
