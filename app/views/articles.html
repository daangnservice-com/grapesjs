  <style>
    :root {
      --seed-orange: #FF6F0F;
      --seed-orange-hover: #E85E00;
      --seed-orange-light: #FFF0E6;
      --seed-gray-900: #212124;
      --seed-gray-800: #333336;
      --seed-gray-700: #4D5159;
      --seed-gray-500: #868B94;
      --seed-gray-300: #D1D3D8;
      --seed-gray-200: #EAEBEE;
      --seed-gray-100: #F2F3F7;
      --seed-gray-50: #FAFAFB;
      --seed-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #FFFFFF;
      color: var(--seed-gray-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* GNB Header */
    .site-header {
      height: 60px;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header-inner {
      max-width: 1140px;
      height: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo img {
      height: 30px;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--seed-gray-800);
      font-size: 14.5px;
      font-weight: 600;
      transition: color 0.15s;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--seed-orange);
    }

    .btn-recruit {
      background: var(--seed-orange);
      color: #fff !important;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      transition: background 0.15s;
    }

    .btn-recruit:hover {
      background: var(--seed-orange-hover);
    }

    /* Hero Banner */
    .articles-hero {
      background: #FAFAFC;
      border-bottom: 1px solid var(--seed-gray-200);
      padding: clamp(32px, 4.5vh, 56px) 24px clamp(24px, 3.5vh, 44px);
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--seed-orange);
      letter-spacing: 0.5px;
      margin-bottom: clamp(8px, 1.2vh, 12px);
    }

    .hero-title {
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      color: var(--seed-gray-900);
      letter-spacing: -0.6px;
      margin-bottom: clamp(10px, 1.5vh, 14px);
    }

    .hero-desc {
      font-size: clamp(15px, 1.8vh, 18px);
      color: var(--seed-gray-500);
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Articles Container */
    .articles-section {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(28px, 4vh, 40px) 24px clamp(48px, 6vh, 80px);
      flex: 1;
    }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: clamp(20px, 3vh, 32px);
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pill-btn {
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid var(--seed-gray-200);
      background: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      color: var(--seed-gray-700);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .pill-btn:hover {
      background: var(--seed-gray-100);
      color: var(--seed-gray-900);
    }

    .pill-btn.active {
      background: var(--seed-orange);
      border-color: var(--seed-orange);
      color: #FFFFFF;
    }

    /* Article Grid */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px 28px;
    }

    @media (max-width: 900px) {
      .articles-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .articles-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Card Component */
    .article-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      background: #FFFFFF;
      border: 1px solid var(--seed-gray-200);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .article-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      border-color: rgba(255, 111, 15, 0.4);
    }

    .card-thumb-wrap {
      width: 100%;
      height: 210px;
      background: var(--seed-gray-100);
      overflow: hidden;
      position: relative;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .article-card:hover .card-thumb {
      transform: scale(1.04);
    }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .card-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--seed-orange);
      background: var(--seed-orange-light);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--seed-gray-900);
      line-height: 1.45;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 14px;
      color: var(--seed-gray-500);
      line-height: 1.6;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--seed-gray-500);
      border-top: 1px solid var(--seed-gray-100);
      padding-top: 14px;
      margin-top: auto;
    }

    /* Empty state */
    .empty-box {
      text-align: center;
      padding: 80px 20px;
      color: var(--seed-gray-500);
      grid-column: 1 / -1;
    }

    /* Footer */
    .site-footer {

    }

    .footer-inner {

      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-info {
      font-size: 13px;
      color: var(--seed-gray-500);
      line-height: 1.6;
    }
  </style>

  <script>
    let articles = [];
    let currentTag = 'all';

    async function fetchArticles() {
      try {
        const res = await fetch('/api/articles');
        const data = await res.json();
        articles = data.articles || [];
        renderCards();
      } catch (err) {
        console.error('Failed to load articles', err);
        document.getElementById('articlesGrid').innerHTML = '<div class="empty-box">아티클을 불러오지 못했습니다.</div>';
      }
    }

    function selectTag(tag, btn) {
      currentTag = tag;
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('articlesGrid');
      let filtered = articles;

      if (currentTag !== 'all') {
        filtered = filtered.filter(a => (a.tags || []).includes(currentTag));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-box">해당 카테고리의 아티클이 아직 없습니다.</div>';
        return;
      }

      grid.innerHTML = filtered.map(a => {
        const thumb = a.thumbnail_url || '/images/daangn-service-logo.png';
        const dateStr = new Date(a.published_at || a.created_at).toLocaleDateString('ko-KR', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).replace(/\. /g, '.').replace(/\.$/, '');

        const tagsHtml = (a.tags || []).map(t => `<span class="card-tag">${t}</span>`).join('');

        return `
          <a href="/articles/${a.slug}" class="article-card">
            <div class="card-thumb-wrap">
              <img src="${thumb}" alt="${escapeHtml(a.title)}" class="card-thumb" onerror="this.src='/images/daangn-service-logo.png'" />
            </div>
            <div class="card-body">
              <div class="card-tags">${tagsHtml}</div>
              <h2 class="card-title">${escapeHtml(a.title)}</h2>
              ${a.subtitle ? `<p class="card-desc">${escapeHtml(a.subtitle)}</p>` : ''}
              <div class="card-meta">
                <span>${escapeHtml(a.author || '당근서비스팀')}</span>
                <span>${dateStr}</span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    fetchArticles();
  </script>
